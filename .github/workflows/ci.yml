name: WORLDSEED CI

on:
  push:
    branches: [ main, final-reality-pass ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js 20.x
      uses: actions/setup-node@v4
      with:
        node-version: 20.x
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Run Test Suite
      run: npm test

    - name: Run Production Build
      run: npm run build

    - name: Install Playwright for browser verification
      run: |
        npm install --no-save playwright@1.55.0
        npx playwright install --with-deps chromium

    - name: Launch WORLDSEED preview
      run: |
        nohup npm run preview -- --host 127.0.0.1 --port 5173 > /tmp/worldseed-preview.log 2>&1 &
        for i in {1..30}; do
          if curl -fsS http://127.0.0.1:5173 >/dev/null; then exit 0; fi
          sleep 1
        done
        cat /tmp/worldseed-preview.log
        exit 1

    - name: Run real Chromium playtest
      run: node scripts/browser-playtest.mjs

    - name: Upload browser-playtest evidence
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: worldseed-browser-playtest
        path: artifacts/browser-playtest
        if-no-files-found: warn

  macos-native-wrapper:
    runs-on: macos-14

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js 20.x
      uses: actions/setup-node@v4
      with:
        node-version: 20.x
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Build and verify native macOS app
      run: npm run build:mac

    - name: Verify native WebKit renders WORLDSEED
      run: |
        APP="build/macos/WORLDSEED.app"
        LOG="$(mktemp)"
        RESULT="$(mktemp)"
        rm -f "$RESULT"

        WORLDSEED_NATIVE_SMOKE_FILE="$RESULT" "$APP/Contents/MacOS/WORLDSEED" >"$LOG" 2>&1 &
        PID=$!

        for i in {1..150}; do
          if [ -s "$RESULT" ]; then
            break
          fi
          if ! kill -0 "$PID" 2>/dev/null; then
            echo "WORLDSEED exited before reporting native render readiness."
            cat "$LOG"
            exit 1
          fi
          sleep 0.1
        done

        if [ ! -s "$RESULT" ]; then
          echo "WORLDSEED did not report native render readiness within 15 seconds."
          cat "$LOG"
          kill "$PID" 2>/dev/null || true
          wait "$PID" || true
          exit 1
        fi

        STATUS="$(cat "$RESULT")"
        cat "$LOG"
        echo "Native render status: $STATUS"

        if [ "$STATUS" != "PASS" ]; then
          kill "$PID" 2>/dev/null || true
          wait "$PID" || true
          exit 1
        fi

        wait "$PID" || true
