name: WORLDSEED CI

on:
  push:
    branches: [ main, final-reality-pass ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js 20.x
      uses: actions/setup-node@v4
      with:
        node-version: 20.x
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Run Test Suite
      run: npm test

    - name: Run Production Build
      run: npm run build

    - name: Install Playwright for browser verification
      run: |
        npm install --no-save playwright@1.55.0
        npx playwright install --with-deps chromium

    - name: Launch WORLDSEED preview
      run: |
        nohup npm run preview -- --host 127.0.0.1 --port 5173 > /tmp/worldseed-preview.log 2>&1 &
        for i in {1..30}; do
          if curl -fsS http://127.0.0.1:5173 >/dev/null; then exit 0; fi
          sleep 1
        done
        cat /tmp/worldseed-preview.log
        exit 1

    - name: Run real Chromium playtest
      run: node scripts/browser-playtest.mjs

    - name: Upload browser-playtest evidence
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: worldseed-browser-playtest
        path: artifacts/browser-playtest
        if-no-files-found: warn
